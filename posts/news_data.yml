- id: "fenics_2026"
  title: "FEniCS 2026: Poromechanics and Skin Micro-circulation"
  date: "2026-06-18"
  category: "Conferences"
  image: "posts/2025/2025-20-11-HPC/fenics2.png"
  short_description: "I presented our research on the impact of mechanical loading on human skin micro-circulation using a FEniCSx implementation at FEniCS 2026 in Paris."
  full_content: "I recently attended the <strong>FEniCS 2026</strong> conference in Paris, France, where I presented our work titled: <em>\"Poromechanics to investigate the impact of mechanical loading on human skin micro-circulation: a FEniCSx implementation\"</em> (T. Lavigne, et al.). <br><br> This research focuses on utilizing a poromechanical approach to better understand the complex interactions between mechanical stress and micro-vascular blood flow in human skin. By leveraging the advanced computational capabilities of <strong>FEniCSx</strong>, we were able to implement this coupled framework efficiently. It was a fantastic opportunity to share our methodologies with the FEniCS community and discuss the numerical challenges associated with biomechanical modeling. <br><br> <a href='https://zenodo.org/records/20632492' target='_blank' class='btn btn-sm btn-outline-primary rounded-pill'>Read the Abstract</a> <a href='https://github.com/Th0masLavigne/2-compartment-poromechanical-and-LDF-measurement.git' target='_blank' class='btn btn-sm btn-outline-secondary rounded-pill'>View Code on GitHub</a> <a href='https://fenicsproject.org/fenics-2026/' target='_blank' class='btn btn-sm btn-outline-info rounded-pill'>Conference Website</a>"

- id: "news_cism_2026"
  title: "CISM School: Parameter Identification Using Full-Field Measurements"
  date: "2026-05-05"
  category: "Education"
  image: "resources/images/misc/cism.png"
  short_description: "Currently in Udine for the CISM-ECCOMAS school, focusing on advanced parameter identification and uncertainty quantification using DIC and DVC."
  full_content: "I am currently in Udine, Italy, attending the CISM-ECCOMAS Advanced School: <strong>Parameter Identification Using Full-Field Measurements</strong>. This intensive course covers how full-field measurement techniques—including Digital Image Correlation (DIC) and <strong>Digital Volume Correlation (DVC)</strong>—provide the spatially distributed data necessary to identify material parameters for complex constitutive models. <br><br> The curriculum explores a variety of identification strategies, ranging from classical <strong>Least Squares</strong> and the <strong>Virtual Field Method</strong> to modern <strong>Physics-Informed Neural Networks (PINNs)</strong>. A major focus of the week is <strong>Uncertainty Quantification</strong>, utilizing Bayesian frameworks to provide reliability indicators for determined parameters. These methodologies are directly applicable to my ongoing work in characterizing the poromechanical properties of hydrogels and biological tissues. <br><br> <a href='https://cism.it/media/filer_public/24/b9/24b90c25-eb59-4198-9fc2-996ab5353302/flyer_c2602_eccomas.pdf' target='_blank' class='btn btn-sm btn-outline-primary rounded-pill'>Download Course Flyer</a>"

- id: "news_ensam_grad_2026"
  title: "PhD Graduation Ceremony: Arts et Métiers (ENSAM)"
  date: "2026-04-08"
  category: "Graduation"
  image: "posts/2026/2026-08-04-diplome_ENSAM/group_picture.jpeg"
  short_description: "Celebrating the conclusion of my cotutelle journey with a second graduation ceremony in Paris."
  full_content: "Following my graduation in Luxembourg last December, I was honored to attend my second ceremony—this time in France. Receiving my French doctoral diploma officially marks the conclusion of my <strong>cotutelle journey</strong> between the University of Luxembourg and <strong>Arts et Métiers (ENSAM Paris)</strong>, in collaboration with I2M Bordeaux. <br><br> Navigating a joint PhD across borders was a challenging but incredibly rewarding experience, allowing me to bridge two academic cultures. This ceremony was the perfect way to celebrate the 'French side' of my research on skin biomechanics alongside the colleagues and friends who made this journey possible. <br><br> None of this would have been possible without the support of many incredible people. A heartfelt thank you to: <ul><li><strong>My Funding:</strong> The FNR (Grant AFR-FNR 17013812) for believing in this project.</li><li><strong>My Mentors:</strong> My supervisors for their guidance.</li><li><strong>My Network:</strong> My colleagues, friends, and family for their unwavering support.</li><li><strong>The Unsung Heroes:</strong> The admin support, IT teams, HR, and doctoral schools who work behind the scenes to make projects like this come to life.</li><li><strong>The Volunteers:</strong> Thank you for participating into the research.</li></ul>"

- id: "news_eta_award_2025"
  title: "Excellent Thesis Award & PhD Graduation"
  date: "2025-12-10"
  category: "Award | Graduation"
  image: "posts/2025/2025-10-12-ETA/ETA.JPG"
  short_description: "Honored to receive the Excellent Thesis Award at the 2025 University of Luxembourg Graduation."
  full_content: "On December 10, 2025, I officially received my doctoral diploma during the University of Luxembourg’s PhD Graduation ceremony. I am incredibly honored to announce that I was also the recipient of an <strong>Excellent Thesis Award (ETA)</strong>, recognizing the quality and impact of my doctoral work. <br><br> It was a privilege to be called on stage to accept this prize and present a portion of my research to an audience including the Rector, Vice-Rector, and the Minister of Higher Education. This milestone belongs to the entire Legato and IBHGC teams. <br><br> None of this would have been possible without the support of many incredible people. A heartfelt thank you to: <ul><li><strong>My Funding:</strong> The FNR (Grant AFR-FNR 17013812) for believing in this project.</li><li><strong>My Mentors:</strong> My supervisors for their guidance.</li><li><strong>My Network:</strong> My colleagues, friends, and family for their unwavering support.</li><li><strong>The Unsung Heroes:</strong> The admin support, IT teams, HR, and doctoral schools who work behind the scenes to make projects like this come to life.</li><li><strong>The Volunteers:</strong> Thank you for participating into the research.</li></ul> <br> <a href='https://www.youtube.com/live/2Aq1HwV_Lv8' target='_blank' class='btn btn-sm btn-outline-primary rounded-pill'>Watch the ceremony recording</a>"

- id: "news_fenicsx_hpc_2025"
  title: "FEniCSx 0.9.0 available on MCIA Curta Cluster"
  date: "2025-11-20"
  category: "Technical"
  image: "posts/2025/2025-20-11-HPC/fenics2.png"
  short_description: "Leading the deployment of FEniCSx for high-performance computing at I2M Bordeaux."
  full_content: "As part of my postdoctoral responsibilities at I2M, I have successfully compiled and installed <strong>FEniCSx 0.9.0</strong> on the <strong>MCIA Curta cluster</strong>. This installation ensures that researchers can leverage the most recent improvements in finite element solving without managing complex local environments or containers. <br><br> The module includes the full stack (DOLFINx, Basix, UFL, FFCx) and scientific libraries like Neper and nlopt. Users can now load the environment via <code>module load fenicsx</code>. I have also released a set of tutorials to help users get started with HPC-based poromechanical simulations. <br><br> <a href='https://th0maslavigne.github.io/FEniCSx_GMSH_tutorials/' target='_blank' class='btn btn-sm btn-outline-primary rounded-pill'>View HPC Tutorials</a>"

- id: "news_inria_mooc_2025"
  title: "Certification: INRIA Reproducible Research"
  date: "2025-08-01"
  category: "Education"
  image: "resources/images/misc/mooc.png"
  short_description: "Achieved certification in reproducible research methodologies for transparent and open science."
  full_content: "I have officially completed the MOOC certification <strong>'Recherche reproductible : principes méthodologiques pour une science transparente'</strong> provided by <strong>INRIA</strong>. This program focused on critical tools for modern open science, including Markdown, Git, and computational notebooks. My research workflow is now fully aligned with these principles, ensuring that all my poromechanical simulations and experimental datasets remain transparent, auditable, and reusable by the international scientific community."

- id: "news_phd_defense_2025"
  title: "PhD Defense: Biomechanical Response of Human Skin"
  date: "2025-06-24"
  category: "Award"
  image: "posts/2025/2025-24-06-PhD/defense3.jpg"
  short_description: "Successfully defended my thesis on hierarchical poromechanical modeling of skin micro-circulation."
  full_content: "I successfully defended my PhD thesis entitled <strong>'Biomechanical Response of Human Skin: a Hierarchical Porous Media Framework'</strong>. This work explored a novel two-compartment porous model to capture the interaction between tissue mechanics and microcirculatory response. <br><br> I am deeply grateful to my supervisors—Stéphane Bordas, Pierre-Yves Rohan, and Giuseppe Sciumè—and the distinguished jury (Yohan Payan, Stéphane Avril, Silvia Budday, and others) for the rich discussions. This defense marks the transition from doctoral candidate to postdoctoral researcher. On to the next chapter in computational biomechanics! <br><br> None of this would have been possible without the support of many incredible people. A heartfelt thank you to: <ul><li><strong>My Funding:</strong> The FNR (Grant AFR-FNR 17013812) for believing in this project.</li><li><strong>My Mentors:</strong> My supervisors for their guidance.</li><li><strong>My Network:</strong> My colleagues, friends, and family for their unwavering support.</li><li><strong>The Unsung Heroes:</strong> The admin support, IT teams, HR, and doctoral schools who work behind the scenes to make projects like this come to life.</li><li><strong>The Volunteers:</strong> Thank you for participating into the research.</li></ul>"

- id: "news_brain_visit_2024"
  title: "Visiting Brainiacs Laboratory at FAU"
  date: "2024-12-12"
  category: "Visiting"
  image: "posts/2024/2024-12-12-Erlangen/furth.jpeg"
  short_description: "A collaborative week in Erlangen exploring brain experimentation and computational modeling."
  full_content: "Thanks to collaborations with <strong>Pr. Silvia Budday</strong>, I spent a productive week visiting the state-of-the-art laboratory of the <strong>Brainiacs</strong> research team at the University of Erlangen-Nuremberg (FAU). This highly collaborative visit allowed me to gain in-depth exposure to advanced brain experimentation and modeling techniques. We discussed joint initiatives regarding <strong>brain shift modeling</strong> and the integration of DVC-based strain tracking into surgical navigation frameworks. A great step forward for our cross-border brain mechanics research."

- id: "news_fenicsx_symp_2024"
  title: "First FEniCSx-Gmsh Training-Symposium"
  date: "2024-09-10"
  category: "Technical"
  image: "posts/2024/2024-09-10-FEniCSx/Simposium.jpg"
  short_description: "Co-organized a successful symposium at I2M Bordeaux focused on open-source finite element modeling."
  full_content: "We had an inspiring time at the <strong>First FEniCSx-Gmsh Training-Symposium</strong> at I2M, Université de Bordeaux. I had the pleasure of co-organizing this event, which brought together researchers from Luxembourg and France for three days of scientific exchange. The symposium focused on bridging the gap between advanced meshing (Gmsh) and the latest DOLFINx developments, fostering a collaborative ecosystem for open-source biomechanical modeling. <br><br> <a href='https://th0maslavigne.github.io/FEniCSx_GMSH_tutorials/' target='_blank' class='btn btn-sm btn-outline-primary rounded-pill'>View Tutorials</a>"

- id: "news_cited_paper_2024"
  title: "Award: Most Cited Paper - Journal of Strain Analysis"
  date: "2024-02-06"
  category: "Award"
  image: "posts/2024/2024-02-06-Most_Cited/2024_01_Most-cited-paper.jpg"
  short_description: "Our work on pantographic metamaterials awarded the 'Most Cited Paper' prize."
  full_content: "Our 2020 article, <strong>'Poynting Effects in Pantographic Metamaterials Captured via Multiscale DVC'</strong>, has been distinguished by the <strong>'Most Cited Paper'</strong> prize in the <em>Journal of Strain Analysis for Engineering Design</em>. This project, conducted with Patrick Auger under the direction of François Hild and Benjamin Smaniotto, utilized micro-CT and multiscale DVC to reveal local contraction mechanisms in architectured materials. It is rewarding to see this work continuing to serve as a reference for validating complex constitutive models."