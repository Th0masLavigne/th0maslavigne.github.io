- title: "ANR Rosaly: Hydrogel Mechanics"
  emoji: "🧫"
  status: "Ongoing"
  role: "Lead PostDoc"
  funding: "ANR ROSALY"
  funding_url: "#"
  categories: "Aneurysm, Poromechanics"
  image: "resources/images/misc/ROSALY.png"
  short_description: "Simulation of the mechanical behavior of collagen hydrogels embedded with contractile cells for understanding aneurysms."
  full_description: "During my postdoctoral position, I will focus on simulating the mechanical behavior of collagen hydrogels using poroelasticity models implemented in FEniCS. The core work involves using experimental data to identify the material’s mechanical properties based on its fabrication conditions. A key objective is the enhancement of these models to incorporate the complex influence of contractile cells within the gel, specifically including their mechanoperception response. Further development will integrate microstructural information to accurately describe how the collagen fibers move and reorient under mechanical load.<br><br><a href='publications.html?search=Hydrogel' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Corneal Mechanics & Refractive Surgery"
  emoji: "👁️"
  status: "Ongoing"
  role: "Collab"
  funding: "Internal"
  funding_url: "#"
  categories: "Ocular Mechanics, Digital Volume Correlation"
  image: "" 
  short_description: "Investigating the intricate lamellar microstructure of the healthy and pathological cornea to predict surgical responses."
  full_description: "We investigate the intricate lamellar microstructure of the healthy and pathological cornea to predict its response to surgical interventions and degenerative diseases. Our multiscale approach combines advanced experimental testing (bulge tests, Optical Coherence Tomography, and 3D Digital Volume Correlation) with custom, microstructure-informed finite element models to characterize anisotropy, structural gradients, and active collagen remodeling.<br><br><a href='publications.html?search=Cornea' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "ANR MATISSE: Porous Liquids & HPC"
  emoji: "💻"
  status: "Ongoing"
  role: "Lead PostDoc"
  funding: "ANR MATISSE"
  funding_url: "#"
  categories: "Poromechanics"
  image: "resources/images/misc/I2M_logo.png"
  short_description: "Simulation of porous liquids using FEniCSx and HPC software deployment at I2M Bordeaux."
  full_description: "I primarily focused on simulating the mechanical behavior of porous fluids (e.g., poroelastic models for fluids) using the advanced finite element software FEniCSx. In addition to leading these simulations, I provide essential computational and numerical support to four specific PhD students to help them overcome technical hurdles in their research. A key institutional responsibility involves installing and configuring the FEniCSx environment on the available MCIA HPC (High-Performance Computing) cluster.<br><br><a href='publications.html?search=MATISSE' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Brain Tissue: Cortical Folding & Oncology"
  emoji: "🧠"
  status: "Ongoing"
  role: "Collab"
  funding: "NS"
  funding_url: "#"
  categories: "Brain Mechanics, Digital Volume Correlation"
  image: "" 
  short_description: "Poromechanics and DVC investigations of fetal cortical folding and complex contact methods."
  full_description: "This collaborative project focuses on the biomechanical modeling of brain tissue, specifically examining cortical folding in fetuses and oncology applications. Working alongside researchers (Meryem Abbad Andaloussi, Univ. Luxembourg, A. Kerachni, IMT Atlantique), we utilize advanced poromechanical models and Digital Volume Correlation (DVC) techniques to analyze strain and deformation in soft brain matter. By implementing robust contact methods, we aim to accurately simulate the complex interactions during fetal brain development and tumor growth, providing crucial insights for neurodevelopmental studies and surgical planning.<br><br><a href='publications.html?search=Brain' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Patent: Neurosurgical Navigation System"
  emoji: "📜"
  status: "Ongoing"
  role: "Co-Inventor"
  funding: "Patent LU509777"
  funding_url: "#"
  categories: "Patent, Brain Mechanics, Surgical Navigation"
  image: "" 
  short_description: "Patent pending for a neurosurgical navigation system using physics-informed intraoperative brain deformation tracking."
  full_description: "This pending patent (LU509777, Luxembourg) covers a novel neurosurgical navigation system designed to accurately track intraoperative brain deformation (commonly known as 'brain shift'). By integrating physics-informed computational modeling, the system dynamically updates the brain's geometric and mechanical state during surgery. This approach bridges advanced biomechanics and clinical practice, enhancing surgical precision and safety by providing surgeons with real-time, highly accurate navigational guidance."

- title: "Unraveling Mechano-Biological Couplings"
  emoji: "🩸"
  status: "Ongoing"
  role: "Lead (PhD)"
  funding: "AFR-FNR Grant"
  funding_url: "https://www.fnr.lu/funding-instruments/afr/"
  categories: "Skin Mechanics, Poromechanics"
  image: "resources/images/misc/ETA_background.jpeg"
  short_description: "Hierarchical porous media framework for personalized medicine and targeted pressure ulcer prevention."
  full_description: "For years, research models studied two risk factors separately — how tissue is compressed and how blood circulates within it. My PhD work combines them in a unified porous model, developed and evaluated alongside new experiments on human patients. Think of the skin as a living sponge filled with tiny blood vessels. When pressure is applied, it’s gradually squeezed, cutting off oxygen — and when released, blood rushes back in. This new model reveals the subtle interplay between mechanical stress and biological response, helping us understand when and how damage starts.<br><br><a href='publications.html?search=Skin' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Breast Oncology & Chemotherapy"
  emoji: "🎗️"
  status: "Past"
  role: "Collab"
  funding: "NS"
  funding_url: "#"
  categories: "Breast Oncology, Mass Transport"
  image: "" 
  short_description: "Collaborative research on image segmentation, and diffusive modeling of chemotherapeutic drugs."
  full_description: "This collaboration (with R. Collet, Univ. Leeds) investigates the efficacy of chemotherapy treatments in breast oncology through advanced computational modeling. The project involves precise image segmentation of breast tissues to create patient-specific geometries. We then develop diffusive models to simulate the transport and absorption of chemotherapeutic drugs within the tumor microenvironment. By analyzing these diffusion patterns, we aim to optimize drug delivery strategies and personalize oncological treatments for better clinical outcomes.<br><br><a href='publications.html?search=Chemotherapy' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Soft Tissue Modelling: Breast Application"
  emoji: "🎀"
  status: "Past"
  role: "Lead (Intern)"
  funding: "ARPE ENS"
  funding_url: "#"
  categories: "Breast Mechanics, Digital Volume Correlation, Contact Mechanics"
  image: "resources/images/misc/breast_scheme.png"
  short_description: "Biomechanical characterization of soft tissues under complex conditions involving large deformation and contact."
  full_description: "This area of research is dedicated to the advanced biomechanical characterization of soft tissues and bodies, particularly under complex conditions involving large deformation and contact. First, we developed and evaluated a Digital Volume Correlation (DVC) pipeline to accurately measure 3D kinematic fields within soft tissues under significant displacements. Complementary to this, the project designed a novel optimization framework that employs an inverse+forward hyper-elasticity formulation to simultaneously identify the unknown material parameters and the contact traction field of soft bodies from measured deformed geometries.<br><br><a href='publications.html?search=Breast' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Skeletal Muscle Tissue Modelling"
  emoji: "💪"
  status: "Past"
  role: "Lead (Master)"
  funding: "ENS"
  funding_url: "#"
  categories: "Muscle Mechanics, Poromechanics"
  image: "resources/images/misc/indent.png"
  short_description: "Numerical investigation of the time-dependent stress–strain mechanical behaviour in the context of pressure ulcer prevention."
  full_description: "This project focuses on the numerical investigation of the time-dependent stress-strain mechanical behaviour of skeletal muscle tissue. This research addresses a critical clinical challenge: the development of Pressure Ulcers (PU). While existing literature often relies on simplified viscoelastic formulations, this work advances the field by developing sophisticated computational models that explicitly characterize the underlying physical mechanisms governing the tissue's time-dependent response under prolonged loading.<br><br><a href='publications.html?search=Muscle' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Neck Muscle Response in Rugby Impacts"
  emoji: "🏉"
  status: "Past"
  role: "Lead (Intern)"
  funding: "ENS"
  funding_url: "#"
  categories: "Impact Mechanics"
  image: "resources/images/misc/impact.jpeg"
  short_description: "Simulink-Based Biomechanical Model of Neck Muscle Response and Concussion Risk."
  full_description: "This research project was dedicated to developing advanced biomechanical models to investigate head and neck dynamics during impact events, with a direct application to concussion prevention in sports such as rugby. The central technical task involved the creation and implementation of rheological muscle models for the cervical spine region within the MATLAB/Simulink simulation environment to assess the protective effect of muscle preactivation.<br><br><a href='publications.html?search=Impact' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"

- title: "Poynting Effects in Pantographic Metamaterials"
  emoji: "🏗️"
  status: "Past"
  role: "Co-Lead (Intern)"
  funding: "ENS"
  funding_url: "#"
  categories: "Digital Volume Correlation"
  image: "resources/images/misc/mesh.png"
  short_description: "Experimental analysis into the complex mechanical behavior of pantographic metamaterials via Multiscale DVC."
  full_description: "This project provides a critical experimental analysis into the complex mechanical behavior of pantographic metamaterials, specifically seeking to understand how their architectured structure influences the Poynting effect. Researchers employed a sophisticated multiscale Digital Volume Correlation (DVC) methodology to analyze an in situ torsion test on a 3D-printed Inconel pantograph, utilizing micro-computed tomography to acquire detailed 3D volumes. This was later applied to breast tissue.<br><br><a href='publications.html?search=Metamaterial' class='btn btn-sm btn-outline-primary rounded-pill'>📚 View Relevant Publications &nbsp; <iconify-icon icon='fa-solid:arrow-right'></iconify-icon></a>"